providers:
  - Ebbbang\Mailroom\MailroomServiceProvider

env:
  - APP_ENV="local"
  - APP_KEY="base64:Vq1p0kGZFPYJnKlBWXK6H0gCkFSlLuF5oNPYPBLBQpM="
  # A file rather than :memory: so captured mail survives between requests
  # when the workbench app is served.
  - DB_CONNECTION="sqlite"
  - MAIL_MAILER="mailroom"
  - MAILROOM_ENABLED=true
  # Gives the demo a Forward button. The log mailer is a real transport as far
  # as the recursion guard is concerned, so the forwarded copy is written to
  # the log rather than sent anywhere.
  - MAILROOM_FORWARD_MAILER="log"
  # Left at its default. Set APP_ENV to something other than local and flip
  # this to false to see the two halves of the forwarding auth guard.
  - MAILROOM_FORWARD_REQUIRE_AUTH=true
  # Bounds the demo to one domain, so trying to forward anywhere else shows
  # the refusal. Clear it to forward to any address again.
  - MAILROOM_FORWARD_ALLOWED="@example.test"
  # Sync, so demo:seed's queued mailable is captured during seeding instead of
  # sitting in the jobs table waiting for a worker nobody is running.
  - QUEUE_CONNECTION="sync"

migrations: true

workbench:
  start: '/mailroom'
  install: true
  discovers:
    config: false
    factories: false
    web: true
    api: false
    commands: true
    components: false
    views: true
